name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs take about a minute; a hung step must not hold the job for GitHub's six hours (#146).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Runs take 20 to 26 minutes (the slowest of the last 30 CI runs, 26); about twice that.
    # One run sat in the Playwright step for 66 minutes (#146).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      # Firefox on the runner has no audio device, so AudioContext.currentTime never advances. A null sink gives it a clock.
      - run: sudo apt-get install -y pulseaudio && pulseaudio --start --exit-idle-time=-1 && pactl load-module module-null-sink sink_name=e2e
      - run: npx playwright test --project=chromium --project=webkit --project=firefox
