<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&family=Unbounded:wght@700&display=swap"
    />
    <style>
      html, body { margin: 0; background: #0e1013; }
      #card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0e1013; color: #e6e8ec; }
      #word { position: absolute; left: 64px; top: 64px; margin: 0; font: 700 68px/1 Unbounded, sans-serif; letter-spacing: -0.02em; }
      #tag { position: absolute; left: 64px; top: 168px; width: 500px; margin: 0; font: 400 30px/1.25 'IBM Plex Sans', sans-serif; color: #c9ced8; }
      #pat { position: absolute; left: 64px; top: 252px; margin: 0; font: 400 20px/1 'IBM Plex Mono', monospace; color: #8b93a1; }
      #juggler { position: absolute; left: 600px; top: 40px; width: 536px; height: 300px; }
      #ladder { position: absolute; left: 64px; top: 372px; width: 1072px; height: 220px; border-radius: 6px; }
      .label { position: absolute; margin: 0; font: 400 14px/1 'IBM Plex Mono', monospace; color: #8b93a1; }
    </style>
  </head>
  <body>
    <div id="card">
      <h1 id="word">anomatom</h1>
      <p id="tag">A juggler is a drum machine.</p>
      <p id="pat">2 2x 2 / 2x 2 · 3:2</p>
      <canvas id="juggler"></canvas>
      <canvas id="ladder"></canvas>
      <p class="label" style="left: 64px; top: 348px">hand 1 · 3 beats</p>
      <p class="label" style="left: 64px; top: 600px">hand 2 · 2 beats</p>
      <p class="label" style="right: 64px; top: 600px">anomatom.com</p>
    </div>
    <script type="module" src="./og.ts"></script>
  </body>
</html>
